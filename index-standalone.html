    class SoundFX {
      constructor() { this.ctx = null; this.gain = null; this.noise = null; }
      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      playChime() {
        try {
          this.init();
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(f, now + i * 0.08);
            gain.gain.setValueAtTime(0, now + i * 0.08);
            gain.gain.linearRampToValueAtTime(0.15, now + i * 0.08 + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.08 + 1.2);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 1.25);
          });
        } catch(e) {}
      }
      playClick() {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(110, now + 0.04);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.04);
        } catch(e) {}
      }
    }

    function PinGate({ onUnlock }) {
      const [pin, setPin] = useState(['', '', '', '', '', '']);
      const [error, setError] = useState(false);
      const [isSuccess, setIsSuccess] = useState(false);
      const inputRefs = useRef([]);

      useEffect(() => {
        if (inputRefs.current[0]) inputRefs.current[0].focus();
      }, []);

      const verify = (code) => {
        if (code === '120426') {
          setIsSuccess(true);
          setError(false);
          sound.playChime();
          localStorage.setItem('DARU_WORK_OS_AUTH_V1', 'AUTHENTICATED_120426');
          setTimeout(() => onUnlock(), 500);
        } else {
          setError(true);
          sound.playClick();
          setTimeout(() => {
            setPin(['', '', '', '', '', '']);
            setError(false);
            if (inputRefs.current[0]) inputRefs.current[0].focus();
          }, 900);
        }
      };

      const handleChange = (idx, val) => {
        if (val.length > 1) {
          const digits = val.replace(/\D/g, '').slice(0, 6).split('');
          const next = [...pin];
          digits.forEach((d, i) => { if (i < 6) next[i] = d; });
          setPin(next);
          if (digits.length === 6) verify(next.join(''));
          return;
        }
        const digit = val.replace(/\D/g, '');
        const next = [...pin];
        next[idx] = digit;
        setPin(next);
        if (digit && idx < 5) inputRefs.current[idx + 1]?.focus();
        if (next.join('').length === 6 && !next.includes('')) verify(next.join(''));
      };

      const handleKeypad = (num) => {
        const emptyIdx = pin.findIndex(d => d === '');
        if (emptyIdx !== -1) {
          const next = [...pin];
          next[emptyIdx] = num;
          setPin(next);
          if (emptyIdx < 5) inputRefs.current[emptyIdx + 1]?.focus();
          if (emptyIdx === 5) verify(next.join(''));
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-center items-center p-4 relative font-sans">
          <div className="w-full max-w-md bg-slate-900/95 border border-slate-800 rounded-2xl p-8 shadow-2xl relative z-10">
            <div className="flex flex-col items-center text-center mb-6">
              <div className="w-16 h-16 rounded-2xl bg-amber-500/10 text-amber-400 border border-amber-500/20 flex items-center justify-center mb-4 text-2xl shadow-lg">
                🔒
              </div>
              <span className="text-[10px] font-bold uppercase tracking-widest text-amber-400 bg-amber-500/10 border border-amber-500/20 px-2.5 py-0.5 rounded-full mb-1">
                COMMAND CENTER
              </span>
              <h1 className="text-2xl font-black text-white">DARU WORK OS</h1>
              <p className="text-xs text-slate-400 mt-1">Akses Terproteksi. Masukkan PIN Otorisasi 6-Digit.</p>
            </div>

            <div className="flex justify-center gap-2.5 mb-6">
              {pin.map((d, i) => (
                <input
                  key={i}
                  ref={el => { inputRefs.current[i] = el; }}
                  type="password"
                  inputMode="numeric"
                  maxLength={1}
                  value={d}
                  onChange={e => handleChange(i, e.target.value)}
                  onKeyDown={e => { if (e.key === 'Backspace' && !pin[i] && i > 0) inputRefs.current[i - 1]?.focus(); }}
                  className={`w-11 h-14 text-center text-xl font-bold rounded-xl border bg-slate-950/80 focus:outline-none transition-all ${
                    d ? 'border-amber-500 text-amber-300' : 'border-slate-800 text-white'
                  } ${error ? 'border-red-500/80 text-red-400' : isSuccess ? 'border-emerald-500/80 text-emerald-400' : 'focus:border-amber-400'}`}
                />
              ))}
            </div>

            {error && <p className="text-xs text-red-400 text-center mb-4">PIN Salah! Silakan coba lagi.</p>}
            {isSuccess && <p className="text-xs text-emerald-400 text-center mb-4">PIN Terverifikasi! Membuka Workspace...</p>}

            <div className="grid grid-cols-3 gap-2.5 max-w-xs mx-auto mb-6">
              {['1','2','3','4','5','6','7','8','9'].map(n => (
                <button key={n} type="button" onClick={() => handleKeypad(n)} className="h-12 rounded-xl bg-slate-800/60 hover:bg-slate-700 border border-slate-700 text-lg font-bold text-white transition-all">
                  {n}
                </button>
              ))}
              <button type="button" onClick={() => setPin(['','','','','',''])} className="h-12 rounded-xl bg-slate-800/30 border border-slate-800 text-xs text-slate-400">Clear</button>
              <button type="button" onClick={() => handleKeypad('0')} className="h-12 rounded-xl bg-slate-800/60 hover:bg-slate-700 border border-slate-700 text-lg font-bold text-white">0</button>
              <button type="button" onClick={() => {
                const last = [...pin].reverse().findIndex(x => x !== '');
                if (last !== -1) {
                  const idx = 5 - last;
                  const next = [...pin];
                  next[idx] = '';
                  setPin(next);
                  inputRefs.current[idx]?.focus();
                }
              }} className="h-12 rounded-xl bg-slate-800/30 border border-slate-800 text-slate-400">⌫</button>
            </div>

            <div className="pt-4 border-t border-slate-800 flex items-center justify-center gap-2 text-[11px] text-slate-400 text-center">
              <span>🛡️ Device ini akan diingat otomatis selamanya.</span>
            </div>
          </div>
        </div>
      );
    }
